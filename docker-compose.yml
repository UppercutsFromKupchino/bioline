services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: app_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
      nuxt:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: app_php
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    # healthcheck:
    #   test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 20s
    restart: unless-stopped

  nuxt:
    build:
      context: ./frontend
      dockerfile: ../docker/nuxt/Dockerfile
    container_name: app_nuxt
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - NPM_CONFIG_LEGACY_PEER_DEPS=true
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  nuxt_node_modules: